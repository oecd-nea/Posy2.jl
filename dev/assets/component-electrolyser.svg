<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="278" viewBox="0 0 1000 278" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="head-level" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c44536"/></marker>
<marker id="head-linked" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e76f51"/></marker>
<marker id="head-fixed" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#264653"/></marker>
<marker id="head-free" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2a9d8f"/></marker>
</defs>
<style>
    text { font-family: system-ui, sans-serif; fill: #263238; }
    .port { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 10px; fill: #546e7a; text-anchor: middle; }
    .noteleft { font-size: 10px; fill: #546e7a; }
    .box { font-size: 11.5px; text-anchor: middle; }
    .boxsub { font-size: 9.5px; fill: #546e7a; text-anchor: middle; }
    .chip { font-size: 9px; fill: #78909c; font-style: italic; text-anchor: middle; }
    .name { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .legend { font-size: 10.5px; fill: #546e7a; }
</style>
<rect x="350" y="26" width="300" height="190" rx="10" fill="#f8f9fa" stroke="#37474f" stroke-width="1.5"/>
<text class="name" x="500.0" y="52">Electrolyser</text>
<line x1="170" y1="82.0" x2="342" y2="82.0" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="none" marker-end="url(#head-free)"/>
<circle cx="350" cy="82.0" r="4.5" fill="#2a9d8f"/>
<text class="port" x="260.0" y="72.0" fill="#2a9d8f">input</text>
<text class="note" x="260.0" y="96.0">electricity, cap</text>
<text class="note" x="260.0" y="108.0">all costs attach here</text>
<line x1="170" y1="160.0" x2="342" y2="160.0" stroke="#e76f51" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#head-linked)"/>
<circle cx="350" cy="160.0" r="4.5" fill="#e76f51"/>
<text class="port" x="260.0" y="150.0" fill="#e76f51">grid losses</text>
<text class="note" x="260.0" y="174.0">only if grid_losses &gt; 0</text>
<text class="note" x="260.0" y="186.0">grid_losses x input</text>
<rect x="20" y="59.0" width="150" height="124.0" rx="6" fill="#fdf6cd" stroke="#c9a227" stroke-width="1" stroke-dasharray="none"/>
<text class="box" x="95.0" y="119.0">electricity node</text>
<text class="boxsub" x="95.0" y="132.0">elec</text>
<line x1="650" y1="121.0" x2="822" y2="121.0" stroke="#e76f51" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#head-linked)"/>
<circle cx="650" cy="121.0" r="4.5" fill="#e76f51"/>
<text class="port" x="740.0" y="111.0" fill="#e76f51">output</text>
<text class="note" x="740.0" y="135.0">efficiency x input</text>
<text class="note" x="740.0" y="147.0">hydrogen production</text>
<rect x="830" y="98.0" width="150" height="46.0" rx="6" fill="#e6effa" stroke="#4a7fb5" stroke-width="1" stroke-dasharray="none"/>
