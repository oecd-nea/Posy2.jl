<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="278" viewBox="0 0 1000 278" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="head-level" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c44536"/></marker>
<marker id="head-linked" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e76f51"/></marker>
<marker id="head-fixed" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#264653"/></marker>
<marker id="head-free" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2a9d8f"/></marker>
</defs>
<style>
    text { font-family: system-ui, sans-serif; fill: #263238; }
    .port { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 10px; fill: #546e7a; text-anchor: middle; }
    .noteleft { font-size: 10px; fill: #546e7a; }
    .box { font-size: 11.5px; text-anchor: middle; }
    .boxsub { font-size: 9.5px; fill: #546e7a; text-anchor: middle; }
    .chip { font-size: 9px; fill: #78909c; font-style: italic; text-anchor: middle; }
    .name { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .legend { font-size: 10.5px; fill: #546e7a; }
</style>
<rect x="350" y="26" width="300" height="190" rx="10" fill="#f8f9fa" stroke="#37474f" stroke-width="1.5"/>
<text class="name" x="500.0" y="52">Intermittent Generation</text>
<line x1="170" y1="121.0" x2="342" y2="121.0" stroke="#264653" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#head-fixed)"/>
<text class="port" x="260.0" y="111.0" fill="#264653">profile</text>
<text class="note" x="260.0" y="135.0">sets output, not a port</text>
<text class="note" x="260.0" y="147.0">values in [0, 1]</text>
<rect x="20" y="98.0" width="150" height="46.0" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="1" stroke-dasharray="5 3"/>
<text class="box" x="95.0" y="113.0">profile series</text>
<text class="boxsub" x="95.0" y="126.0">profiles_&lt;weatheryear&gt;</text>
<text class="boxsub" x="95.0" y="139.0">column: &lt;techkey&gt;_&lt;node&gt;</text>
<line x1="650" y1="82.0" x2="822" y2="82.0" stroke="#264653" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#head-fixed)"/>
<circle cx="650" cy="82.0" r="4.5" fill="#264653"/>
<text class="port" x="740.0" y="72.0" fill="#264653">output</text>
<text class="note" x="740.0" y="96.0">cap x profile each hour</text>
<text class="note" x="740.0" y="108.0">curtailed at the node</text>
<line x1="650" y1="160.0" x2="822" y2="160.0" stroke="#e76f51" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#head-linked)"/>
<circle cx="650" cy="160.0" r="4.5" fill="#e76f51"/>
<text class="port" x="740.0" y="150.0" fill="#e76f51">co2</text>
<text class="note" x="740.0" y="174.0">only if co2_emission &gt; 0</text>
<text class="note" x="740.0" y="186.0">output x co2_emission / 1000</text>
<rect x="830" y="59.0" width="150" height="46.0" rx="6" fill="#fdf6cd" stroke="#c9a227" stroke-width="1" stroke-dasharray="none"/>
<text class="box" x="905.0" y="80.0">electricity node</text>
<text class="boxsub" x="905.0" y="93.0">elec</text>
<rect x="830" y="137.0" width="150" height="46.0" rx="6" fill="#eceff1" stroke="#78909c" stroke-width="1" stroke-dasharray="none"/>
<text class="box" x="905.0" y="158.0">CO2 node</text>
<text class="boxsub" x="905.0" y="171.0">co2</text>
<line x1="20" y1="256" x2="44" y2="256" stroke="#264653" stroke-width="2.5" stroke-dasharray="7 4"/>
<text class="legend" x="51" y="260">exogenous fixed flow</text>
<line x1="217" y1="256" x2="241" y2="256" stroke="#e76f51" stroke-width="2.5" stroke-dasharray="3 3"/>
<text class="legend" x="248" y="260">linked flow</text>
<rect x="351" y="249" width="24" height="14" rx="3" fill="#ffffff" stroke="#78909c" stroke-dasharray="5 3"/>
<text class="legend" x="382" y="260">not connected</text>
</svg>
