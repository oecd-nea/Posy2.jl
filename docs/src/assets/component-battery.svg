<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="head-level" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c44536"/></marker>
<marker id="head-linked" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e76f51"/></marker>
<marker id="head-fixed" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#264653"/></marker>
<marker id="head-free" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2a9d8f"/></marker>
</defs>
<style>
    text { font-family: system-ui, sans-serif; fill: #263238; }
    .port { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 10px; fill: #546e7a; text-anchor: middle; }
    .noteleft { font-size: 10px; fill: #546e7a; }
    .box { font-size: 11.5px; text-anchor: middle; }
    .boxsub { font-size: 9.5px; fill: #546e7a; text-anchor: middle; }
    .chip { font-size: 9px; fill: #78909c; font-style: italic; text-anchor: middle; }
    .name { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .legend { font-size: 10.5px; fill: #546e7a; }
</style>
<rect x="350" y="26" width="300" height="210" rx="10" fill="#f8f9fa" stroke="#37474f" stroke-width="1.5"/>
<text class="name" x="500.0" y="52">Battery Storage</text>
<line x1="170" y1="92.0" x2="342" y2="92.0" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="none" marker-end="url(#head-free)"/>
<circle cx="350" cy="92.0" r="4.5" fill="#2a9d8f"/>
<text class="port" x="260.0" y="82.0" fill="#2a9d8f">input</text>
<text class="note" x="260.0" y="106.0">charging, cap</text>
<text class="note" x="260.0" y="118.0">eff_i, all costs attach here</text>
<line x1="170" y1="170.0" x2="342" y2="170.0" stroke="#e76f51" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#head-linked)"/>
<circle cx="350" cy="170.0" r="4.5" fill="#e76f51"/>
<text class="port" x="260.0" y="160.0" fill="#e76f51">grid losses</text>
<text class="note" x="260.0" y="184.0">only if grid_losses &gt; 0</text>
<text class="note" x="260.0" y="196.0">grid_losses x input</text>
<rect x="20" y="69.0" width="150" height="124.0" rx="6" fill="#fdf6cd" stroke="#c9a227" stroke-width="1" stroke-dasharray="none"/>
<text class="box" x="95.0" y="129.0">electricity node</text>
<text class="boxsub" x="95.0" y="142.0">elec</text>
<text class="chip" x="95.0" y="205.0">(same node)</text>
<line x1="650" y1="131.0" x2="822" y2="131.0" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="none" marker-end="url(#head-free)"/>
<circle cx="650" cy="131.0" r="4.5" fill="#2a9d8f"/>
<text class="port" x="740.0" y="121.0" fill="#2a9d8f">output</text>
<text class="note" x="740.0" y="145.0">discharging, no own capacity</text>
<text class="note" x="740.0" y="157.0">bounded by cap through Duration</text>
<rect x="830" y="108.0" width="150" height="46.0" rx="6" fill="#fdf6cd" stroke="#c9a227" stroke-width="1" stroke-dasharray="none"/>
<text class="box" x="905.0" y="129.0">electricity node</text>
<text class="boxsub" x="905.0" y="142.0">elec</text>
<text class="chip" x="905.0" y="166.0">(same node)</text>
<rect x="372" y="104" width="88" height="98" rx="4" fill="#ffffff" stroke="#c44536" stroke-width="1.5"/>
<rect x="372" y="145.16" width="88" height="56.839999999999996" rx="4" fill="#c44536" fill-opacity="0.28"/>
<line x1="372" y1="145.16" x2="460" y2="145.16" stroke="#c44536" stroke-width="1.5"/>
<line x1="416.0" y1="198" x2="416.0" y2="152.16" stroke="#2a9d8f" stroke-width="2" marker-end="url(#head-free)"/>
<text class="note" x="416.0" y="215">0</text>
<text class="port" x="416.0" y="95" fill="#c44536">level</text>
<text class="noteleft" x="478" y="147.0">duration x cap</text>
<text class="noteleft" x="478" y="159.0">Duration ties the level</text>
<text class="noteleft" x="478" y="171.0">to charging power</text>
<line x1="20" y1="288" x2="44" y2="288" stroke="#2a9d8f" stroke-width="2.5" stroke-dasharray="none"/>
<text class="legend" x="51" y="292">optimized flow</text>
<line x1="175" y1="288" x2="199" y2="288" stroke="#e76f51" stroke-width="2.5" stroke-dasharray="3 3"/>
<text class="legend" x="206" y="292">linked flow</text>
<line x1="309" y1="288" x2="333" y2="288" stroke="#c44536" stroke-width="2.5" stroke-dasharray="none"/>
<text class="legend" x="340" y="292">stored energy</text>
</svg>
