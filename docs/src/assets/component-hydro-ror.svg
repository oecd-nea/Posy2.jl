<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="238" viewBox="0 0 1000 238" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="head-level" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c44536"/></marker>
<marker id="head-linked" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e76f51"/></marker>
<marker id="head-fixed" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#264653"/></marker>
<marker id="head-free" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2a9d8f"/></marker>
</defs>
<style>
    text { font-family: system-ui, sans-serif; fill: #263238; }
    .port { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .note { font-size: 10px; fill: #546e7a; text-anchor: middle; }
    .noteleft { font-size: 10px; fill: #546e7a; }
    .box { font-size: 11.5px; text-anchor: middle; }
    .boxsub { font-size: 9.5px; fill: #546e7a; text-anchor: middle; }
    .chip { font-size: 9px; fill: #78909c; font-style: italic; text-anchor: middle; }
    .name { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .legend { font-size: 10.5px; fill: #546e7a; }
</style>
<rect x="350" y="26" width="300" height="150" rx="10" fill="#f8f9fa" stroke="#37474f" stroke-width="1.5"/>
<text class="name" x="500.0" y="52">Run-of-river Hydro</text>
<line x1="170" y1="101.0" x2="342" y2="101.0" stroke="#264653" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#head-fixed)"/>
<text class="port" x="260.0" y="91.0" fill="#264653">intake envelope</text>
<text class="note" x="260.0" y="115.0">output &lt;= hourly intake</text>
