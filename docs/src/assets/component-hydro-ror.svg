<rect x="20" y="78.0" width="150" height="46.0" rx="6" fill="#ffffff" stroke="#78909c" stroke-width="1" stroke-dasharray="5 3"/>
<text class="box" x="95.0" y="93.0">intake series</text>
<text class="boxsub" x="95.0" y="106.0">hydro_ror_&lt;weather_year&gt;</text>
<text class="boxsub" x="95.0" y="119.0">column: zone</text>
<line x1="650" y1="101.0" x2="822" y2="101.0" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="none" marker-end="url(#head-free)"/>
<circle cx="650" cy="101.0" r="4.5" fill="#2a9d8f"/>
<text class="port" x="740.0" y="91.0" fill="#2a9d8f">output</text>
<text class="note" x="740.0" y="115.0">cap, investment, fom, vom</text>
